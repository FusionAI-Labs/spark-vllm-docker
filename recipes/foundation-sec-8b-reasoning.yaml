# Recipe: fdtn-ai/Foundation-Sec-8B-Reasoning

recipe_version: "1"
name: Foundation-Sec-8B-Reasoning
description: vLLM serving Foundation-Sec-8B-Reasoning

# HuggingFace model to download (optional, for --download-model)
model: fdtn-ai/Foundation-Sec-8B-Reasoning

#solo_only: true

# Container image to use
container: vllm-node

# No mods required
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 8008
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.3
  max_model_len: 32768 

# The vLLM serve command template
command: |
  vllm serve "fdtn-ai/Foundation-Sec-8B-Reasoning" \
    --host 0.0.0.0 \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --reasoning-parser minimax_m2
