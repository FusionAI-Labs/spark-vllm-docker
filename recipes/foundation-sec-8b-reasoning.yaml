# Recipe: fdtn-ai/Foundation-Sec-8B-Reasoning

recipe_version: "1"
name: Foundation-Sec-8B-Reasoning
description: vLLM serving Foundation-Sec-8B-Reasoning

# HuggingFace model to download (optional, for --download-model)
model: fdtn-ai/Foundation-Sec-8B-Reasoning

#solo_only: true

# Container image to use
container: vllm-node-tf5

build_args:
  - --tf5

# No mods required
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.33333
  max_model_len: 32768 

env:
   VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 1

# The vLLM serve command template
command: |
  vllm serve "fdtn-ai/Foundation-Sec-8B-Reasoning" \
    --host {host} \
    --port {port} \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --reasoning-parser minimax_m2 \
    --attention-backend flashinfer \
    -tp {tensor_parallel} --distributed-executor-backend ray
