# Recipe: Gemma-4-31B-it-int4-AutoRound

recipe_version: "1"
name: Gemma-4-31B-it-int4-AutoRound
description: vLLM serving Gemma-4-31B-it-int4-AutoRound

# HuggingFace model to download (optional, for --download-model)
model: Intel/gemma-4-31B-it-int4-AutoRound

solo_only: true

# Container image to use
container: vllm-node-tf5

build_args:
  - --tf5

# Mods
mods:
  - mods/fix-gemma4-tool-parser

# Default settings (can be overridden via CLI)
defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.35
  max_model_len: 128000
  max_num_batched_tokens: 8192

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve Intel/gemma-4-31B-it-int4-AutoRound  \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser gemma4 \
    --reasoning-parser gemma4 \
    --max-num-batched-tokens {max_num_batched_tokens}
    
